name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: malaf
          POSTGRES_PASSWORD: malaf
          POSTGRES_DB: malaf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://malaf:malaf@localhost:5432/malaf_ci
      DIRECT_URL: postgresql://malaf:malaf@localhost:5432/malaf_ci
      JWT_SECRET: ci-test-secret
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: backend
        run: npx prisma db push

      - name: Type check
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm test
